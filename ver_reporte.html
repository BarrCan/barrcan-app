<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BarrCan · Reporte</title>
<!--
  BARRCAN · VISOR DE REPORTES (público)
  VERSION : v1.0
  FECHA   : 2026-10-04
  v1.0 - Supabase Storage sirve los .html como text/plain con
    "Content-Security-Policy: sandbox" a propósito (seguridad), por eso
    las ligas directas a reportes salían como código o en blanco en
    WhatsApp. Esta página vive en GitHub Pages, LEE el reporte desde
    Supabase (eso sí está permitido) y lo muestra como página normal.
    Uso: ver_reporte.html?f=ENT-166-01.html
    Solo acepta archivos del bucket público de BarrCan.
-->
<style>
  body{font-family:Arial,sans-serif;color:#1B3A5C;display:flex;align-items:center;justify-content:center;min-height:90vh;margin:0;padding:20px;text-align:center}
  .c{max-width:340px} .s{width:34px;height:34px;border:4px solid #E2E7EC;border-top-color:#C8923A;border-radius:50%;animation:g 1s linear infinite;margin:0 auto 14px}
  @keyframes g{to{transform:rotate(360deg)}} small{color:#5B6B7A}
</style>
</head>
<body>
<div class="c" id="msg"><div class="s"></div><b>Cargando su comprobante…</b><br><small>BarrCan Cancelería</small></div>
<script>
(function () {
  var BASE = 'https://rmngjtzupukhylxlgcww.supabase.co/storage/v1/object/public/reportes/';
  var f = new URLSearchParams(location.search).get('f') || '';
  function error(t) { document.getElementById('msg').innerHTML = '<b>' + t + '</b><br><small>BarrCan Cancelería · 56-15-15-84-15</small>'; }
  // Solo nombres de archivo del bucket (sin rutas raras ni otros sitios)
  if (!/^[A-Za-z0-9_\-\/]+\.html$/.test(f) || f.indexOf('..') >= 0) { error('Liga no válida'); return; }
  fetch(BASE + f.split('/').map(encodeURIComponent).join('/'), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { error('No se pudo cargar el comprobante. Revise su conexión e intente de nuevo.'); });
})();
</script>
</body>
</html>
