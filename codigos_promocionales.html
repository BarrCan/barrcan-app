<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BarrCan &middot; Códigos Promocionales</title>
<!--
  BARRCAN · MODULO: CODIGOS PROMOCIONALES (standalone)
  VERSION : v1.0
  FECHA   : 2026-09-05
  v1.0 - Creación inicial. Administra la tabla codigos_promocionales
    que ya usan Baños/Nacional/Español/Eurovent/Servicios/Stands
    (Cubiertas pendiente). Crear, editar, activar/desactivar, y
    asignar/quitar un cliente específico (candado por cliente) sin
    necesitar SQL manual cada vez.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --navy: #1B3A5C; --blue: #2E6DA4; --gold: #C8923A; --gold-light: #E8B96A;
  --white: #FFFFFF; --off-white: #F7F5F0; --gray-100: #F0EDE8; --gray-200: #DDD9D2;
  --gray-400: #9A9590; --gray-600: #5A5652; --green: #2D7D46; --red: #C0392B;
  --shadow-sm: 0 2px 8px rgba(27,58,92,0.08); --radius: 12px; --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; font-family:'DM Sans',sans-serif; background:var(--off-white); color:var(--navy); overscroll-behavior:none; }
#app { min-height:100vh; display:flex; flex-direction:column; }
.header { background:var(--navy); padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,.3); position:sticky; top:0; z-index:100; }
.header-logo { display:flex; align-items:center; gap:10px; }
.logo-mark { width:32px; height:32px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:900; font-size:16px; color:var(--navy); }
.logo-text { font-family:'Playfair Display',serif; font-weight:700; font-size:18px; color:#fff; }
.logo-sub { font-size:9px; color:var(--gold-light); letter-spacing:2px; text-transform:uppercase; display:block; margin-top:-3px; }
.offline-badge { display:flex; align-items:center; gap:5px; background:rgba(200,146,58,.15); border:1px solid rgba(200,146,58,.3); border-radius:20px; padding:4px 10px; font-size:11px; color:var(--gold-light); font-weight:500; }
.offline-dot { width:6px; height:6px; border-radius:50%; background:var(--gold-light); animation:pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
.content { flex:1; padding:16px 16px 60px; max-width:600px; margin:0 auto; width:100%; }
.section-title { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:var(--navy); margin-bottom:3px; }
.section-sub { font-size:11.5px; color:var(--gray-400); margin-bottom:14px; }
.wizard-card { background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.wizard-title { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:10px; }
.form-label { display:block; font-size:11px; font-weight:600; color:var(--gray-600); margin-bottom:5px; }
.form-input { width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:var(--radius-sm); font-family:'DM Sans',sans-serif; font-size:14px; color:var(--navy); background:var(--off-white); box-sizing:border-box; }
.form-input:focus { outline:none; border-color:var(--blue); background:#fff; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-group { margin-bottom:10px; }
.form-group:last-child { margin-bottom:0; }
.btn-guardar { width:100%; padding:14px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:#fff; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(200,146,58,.35); }
.codigo-card { background:#fff; border-radius:10px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); border-left:4px solid var(--gray-200); }
.codigo-card.activo { border-left-color:var(--green); }
.codigo-card.inactivo { border-left-color:var(--red); opacity:.7; }
.codigo-card.candado { border-left-color:var(--gold); }
.codigo-nombre { font-family:'DM Mono',monospace; font-size:15px; font-weight:800; color:var(--navy); }
.codigo-meta { font-size:11px; color:var(--gray-400); margin-top:2px; }
.codigo-pill { display:inline-block; font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.pill-activo { background:rgba(45,125,70,.12); color:var(--green); }
.pill-inactivo { background:rgba(192,57,43,.12); color:var(--red); }
.pill-candado { background:rgba(200,146,58,.15); color:var(--gold); }
.codigo-acciones { display:flex; gap:8px; margin-top:10px; }
.btn-mini { flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--gray-200); background:#fff; font-size:11px; font-weight:700; cursor:pointer; color:var(--navy); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; opacity:0; transition:all .3s; z-index:999; white-space:nowrap; pointer-events:none; max-width:90vw; text-align:center; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(-6px); }
.bloqueado { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; padding:40px 20px; text-align:center; }
.bloqueado h2 { font-family:'Playfair Display',serif; color:var(--navy); margin-bottom:8px; }
.bloqueado p { color:var(--gray-400); font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-logo">
      <div class="logo-mark">B</div>
      <div><div class="logo-text">BarrCan</div><span class="logo-sub">Códigos Promo</span></div>
    </div>
    <div class="offline-badge"><span class="offline-dot"></span><span id="conn-status">Online</span></div>
  </div>

  <div id="pantalla-bloqueada" style="display:none">
    <div class="bloqueado">
      <h2>🔒 Acceso privado</h2>
      <p>Este módulo es solo para administración.</p>
    </div>
  </div>

  <div id="pantalla-contenido" style="display:none">
    <div class="content">
      <div class="section-title">🏷️ Códigos Promocionales</div>
      <div class="section-sub">Compartidos por todos los cotizadores y usables también en Shopify (crea el mismo texto ahí, en su sistema nativo de descuentos).</div>

      <div class="wizard-card">
        <div class="wizard-title" id="cp-form-titulo">➕ Nuevo código</div>
        <div class="form-group">
          <label class="form-label">Código <span style="color:var(--gray-400);font-weight:400">(lo que escribe el cliente/técnico)</span></label>
          <input type="text" id="cp-codigo" class="form-input" placeholder="Ej: SEPTMX26" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Descuento (%)</label>
            <input type="number" id="cp-descuento" class="form-input" placeholder="13.5" step="0.1" min="0" max="100">
          </div>
          <div class="form-group">
            <label class="form-label">Activo</label>
            <select id="cp-activo" class="form-input">
              <option value="true">✅ Sí</option>
              <option value="false">🚫 No</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Vigencia desde</label>
            <input type="date" id="cp-fecha-inicio" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Vigencia hasta</label>
            <input type="date" id="cp-fecha-fin" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Cliente asignado <span style="color:var(--gray-400);font-weight:400">(vacío = abierto para cualquiera)</span></label>
          <input type="text" id="cp-cliente" class="form-input" placeholder="Ej: Juan Pérez -- déjalo vacío si es general">
        </div>
        <div class="form-group">
          <label class="form-label">Descripción <span style="color:var(--gray-400);font-weight:400">(opcional, nota interna)</span></label>
          <input type="text" id="cp-descripcion" class="form-input" placeholder="Ej: Promoción de septiembre">
        </div>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn-guardar" onclick="cpGuardar()" style="flex:1">💾 Guardar</button>
          <button type="button" id="cp-btn-cancelar" onclick="cpCancelarEdicion()" style="display:none;padding:0 16px;background:var(--gray-200);color:var(--navy);border:none;border-radius:8px;font-weight:700;cursor:pointer">Cancelar</button>
        </div>
      </div>

      <div class="wizard-card">
        <div class="wizard-title">📋 Códigos existentes <button type="button" onclick="cpCargarLista()" style="margin-left:auto;background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;text-decoration:underline;float:right">🔄 Actualizar</button></div>
        <div id="cp-lista"><div style="text-align:center;padding:14px;color:var(--gray-400);font-size:12px">Cargando…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var APP_VERSION = 'v1.0';
var SB_URL='https://rmngjtzupukhylxlgcww.supabase.co';
var SB_KEY='sb_publishable_udZ-NNvSLrSaDk2dBRPwMg_IQCZ4N2I';
var _sbClient=null;
function sb(){
  if(!_sbClient&&window.supabase){
    _sbClient=window.supabase.createClient(SB_URL,SB_KEY,{db:{schema:'barrcan'},auth:{persistSession:true,storageKey:'barrcan_auth'}});
  }
  return _sbClient;
}
window.addEventListener('online', function(){detectarConexion();});
window.addEventListener('offline',function(){detectarConexion();});
function detectarConexion(){var b=document.getElementById('conn-status');if(b)b.textContent=(navigator.onLine?'Online':'Offline')+' · '+APP_VERSION;}
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,dur){dur=dur||2600;var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},dur);}
function fechaHoyLocal(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function esSupremo() {
  try {
    var u = JSON.parse(localStorage.getItem('barrcan_usuario_activo') || '{}');
    return u.id === 'MAU';
  } catch(e) { return false; }
}

var CP_EDITANDO_ID = null;
var CP_CACHE = [];

function cpLimpiarForm() {
  CP_EDITANDO_ID = null;
  document.getElementById('cp-form-titulo').textContent = '➕ Nuevo código';
  document.getElementById('cp-btn-cancelar').style.display = 'none';
  document.getElementById('cp-codigo').value = '';
  document.getElementById('cp-descuento').value = '';
  document.getElementById('cp-activo').value = 'true';
  var hoy = fechaHoyLocal();
  document.getElementById('cp-fecha-inicio').value = hoy;
  var fin = new Date(); fin.setMonth(fin.getMonth() + 1);
  document.getElementById('cp-fecha-fin').value = fin.getFullYear()+'-'+String(fin.getMonth()+1).padStart(2,'0')+'-'+String(fin.getDate()).padStart(2,'0');
  document.getElementById('cp-cliente').value = '';
  document.getElementById('cp-descripcion').value = '';
}

function cpCancelarEdicion() { cpLimpiarForm(); }

async function cpGuardar() {
  var codigo = document.getElementById('cp-codigo').value.trim().toUpperCase();
  var descuento = parseFloat(document.getElementById('cp-descuento').value);
  var activo = document.getElementById('cp-activo').value === 'true';
  var fechaInicio = document.getElementById('cp-fecha-inicio').value;
  var fechaFin = document.getElementById('cp-fecha-fin').value;
  var cliente = document.getElementById('cp-cliente').value.trim();
  var descripcion = document.getElementById('cp-descripcion').value.trim();

  if (!codigo) { toast('⚠️ Falta el código'); return; }
  if (!descuento || descuento <= 0) { toast('⚠️ Falta el % de descuento'); return; }
  if (!fechaInicio || !fechaFin) { toast('⚠️ Falta la vigencia'); return; }
  if (fechaFin < fechaInicio) { toast('⚠️ La fecha final no puede ser antes que la inicial'); return; }
  if (!sb()) { toast('Sin conexión'); return; }

  var payload = {
    codigo: codigo, descuento_pct: descuento, activo: activo,
    fecha_inicio: fechaInicio, fecha_fin: fechaFin,
    cliente_asignado: cliente || null, descripcion: descripcion || null
  };

  try {
    var res = CP_EDITANDO_ID
      ? await sb().from('codigos_promocionales').update(payload).eq('id', CP_EDITANDO_ID)
      : await sb().from('codigos_promocionales').insert([payload]);
    if (res.error) throw res.error;
    toast(CP_EDITANDO_ID ? '✅ Código actualizado' : '✅ Código creado');
    cpLimpiarForm();
    cpCargarLista();
  } catch (e) {
    if ((e.message || '').indexOf('duplicate') >= 0 || (e.message || '').indexOf('unique') >= 0) {
      toast('⚠️ Ya existe un código con ese texto');
    } else {
      toast('No se pudo guardar: ' + e.message);
    }
  }
}

function cpEditar(id) {
  var c = CP_CACHE.find(function(x) { return x.id === id; });
  if (!c) return;
  CP_EDITANDO_ID = id;
  document.getElementById('cp-form-titulo').textContent = '✏️ Editando ' + c.codigo;
  document.getElementById('cp-btn-cancelar').style.display = 'block';
  document.getElementById('cp-codigo').value = c.codigo;
  document.getElementById('cp-descuento').value = c.descuento_pct;
  document.getElementById('cp-activo').value = c.activo ? 'true' : 'false';
  document.getElementById('cp-fecha-inicio').value = c.fecha_inicio;
  document.getElementById('cp-fecha-fin').value = c.fecha_fin;
  document.getElementById('cp-cliente').value = c.cliente_asignado || '';
  document.getElementById('cp-descripcion').value = c.descripcion || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function cpToggleActivo(id, nuevoValor) {
  if (!sb()) { toast('Sin conexión'); return; }
  try {
    var res = await sb().from('codigos_promocionales').update({ activo: nuevoValor }).eq('id', id);
    if (res.error) throw res.error;
    toast(nuevoValor ? '✅ Código activado' : '🚫 Código desactivado');
    cpCargarLista();
  } catch (e) { toast('Error: ' + e.message); }
}

async function cpQuitarCandado(id) {
  if (!sb()) { toast('Sin conexión'); return; }
  try {
    var res = await sb().from('codigos_promocionales').update({ cliente_asignado: null }).eq('id', id);
    if (res.error) throw res.error;
    toast('🔓 Candado quitado -- ya es abierto para cualquiera');
    cpCargarLista();
  } catch (e) { toast('Error: ' + e.message); }
}

async function cpCargarLista() {
  var cont = document.getElementById('cp-lista');
  if (!sb()) { cont.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:12px">Sin conexión</div>'; return; }
  try {
    var res = await sb().from('codigos_promocionales').select('*').order('created_at', { ascending: false });
    if (res.error) throw res.error;
    CP_CACHE = res.data || [];
    if (!CP_CACHE.length) { cont.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:12px">Sin códigos todavía</div>'; return; }
    var hoy = fechaHoyLocal();
    cont.innerHTML = CP_CACHE.map(function(c) {
      var vencido = hoy > c.fecha_fin;
      var clase = !c.activo ? 'inactivo' : (c.cliente_asignado ? 'candado' : 'activo');
      return '<div class="codigo-card ' + clase + '">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        + '<div>'
        + '<span class="codigo-nombre">' + esc(c.codigo) + '</span>'
        + (c.activo ? '<span class="codigo-pill pill-activo">ACTIVO</span>' : '<span class="codigo-pill pill-inactivo">INACTIVO</span>')
        + (c.cliente_asignado ? '<span class="codigo-pill pill-candado">🔒 ' + esc(c.cliente_asignado) + '</span>' : '')
        + '<div class="codigo-meta">' + c.descuento_pct + '% de descuento &middot; vigente ' + c.fecha_inicio + ' a ' + c.fecha_fin + (vencido ? ' <span style="color:var(--red);font-weight:700">(vencido)</span>' : '') + '</div>'
        + (c.descripcion ? '<div class="codigo-meta">' + esc(c.descripcion) + '</div>' : '')
        + '<div class="codigo-meta">Usado ' + (c.veces_usado || 0) + ' vez/veces</div>'
        + '</div></div>'
        + '<div class="codigo-acciones">'
        + '<button type="button" class="btn-mini" onclick="cpEditar(\'' + c.id + '\')">✏️ Editar</button>'
        + '<button type="button" class="btn-mini" onclick="cpToggleActivo(\'' + c.id + '\', ' + (!c.activo) + ')">' + (c.activo ? '🚫 Desactivar' : '✅ Activar') + '</button>'
        + (c.cliente_asignado ? '<button type="button" class="btn-mini" onclick="cpQuitarCandado(\'' + c.id + '\')">🔓 Quitar candado</button>' : '')
        + '</div></div>';
    }).join('');
  } catch (e) { cont.innerHTML = '<div style="text-align:center;padding:14px;color:var(--red);font-size:12px">Error: ' + e.message + '</div>'; }
}

document.addEventListener('DOMContentLoaded', function() {
  detectarConexion();
  if (!esSupremo()) {
    document.getElementById('pantalla-bloqueada').style.display = 'block';
    return;
  }
  document.getElementById('pantalla-contenido').style.display = 'block';
  cpLimpiarForm();
  cpCargarLista();
});
</script>
</body>
</html>
