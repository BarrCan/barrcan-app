  BARRCAN · MODULO: MENSAJES LISTOS (standalone)
  VERSION : v1.3
  FECHA   : 2026-10-22
  v1.3 - RECUPERADO Y PUBLICADO: 7 categorías (Primer contacto, Visita, Ventas, Seguimiento, Cobranza,
    Entrega, Postventa) y 26 plantillas. Cada una tiene versión de USTED (default, clientes nuevos) y de TÚ
    (clientes frecuentes), con interruptor arriba. Variables nuevas: {saludo} (según la hora), {firma},
    {costo_visita}, {datos_pago}, {incluye}, {fecha}, {alt}, {anticipo}, {liga_garantia}, {liga_resena}.
    Lo que no se puede llenar solo queda entre [corchetes] y el módulo avisa antes de abrir WhatsApp.
    Datos de pago/reseña/firma se guardan en el dispositivo (no en el código, porque el repo es público).
    FIX: {fecha} ya no se rellena con la fecha de HOY (en "Confirmar instalación" quedaba como fecha de
    instalación). FIX: ya no ofrece presupuestos eliminados. FIX: al borrar la búsqueda se limpia el folio.
    NOTA: este contenido se construyó el 9-oct en otro chat como "v1.2", pero solo se entregó como archivo
    y nunca se publicó; el número v1.2 lo tomó el candado. Por eso aquí queda como v1.3.
  VERSION : v1.2
  FECHA   : 2026-10-14
  v1.2 - CANDADO: sin sesión del día (PIN o huella en el portal) ya no abre; manda al portal y regresa aquí al entrar (modulos/acceso.js).
  VERSION : v1.1
  FECHA   : 2026-10-08
  v1.1 - Logo oficial (assets/logo-icono.jpg) en el encabezado; antes solo
    mostraba una letra B. Si la imagen no carga, vuelve a la B.
  VERSION : v1.0
  FECHA   : 2026-08-29
  v1.0 - Creación inicial. Primero de los 3 huecos identificados al
    comparar contra un producto genérico de "maletín digital del
    vidriero" (catálogo WhatsApp, mensajes listos, guía de cuánto
    cobrar) -- este es "mensajes listos".
    10 plantillas en 4 categorías (Ventas, Pagos, Entrega/Instalación,
    Postventa), cada una con variables que se llenan solas al elegir
    un folio (cliente, monto, saldo, fecha). El texto queda editable
    antes de enviar -- nunca se manda nada sin que la persona lo vea
    y confirme primero. Botón para copiar o abrir WhatsApp directo
    (usa el teléfono del cliente si existe en el presupuesto).
-->

<style>

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    <div class="wizard-card">

      <input type="text" class="form-input" id="msj-nombre-manual" placeholder="Ej: Ing. Raymundo" autocomplete="off">
    </div>

    <details class="wizard-card" id="msj-cfg-card">
      <summary class="cfg-sum">⚙️ Mis datos para los mensajes</summary>
      <div style="margin-top:12px">
        <label class="form-label">Datos de pago <span style="color:var(--gray-400);font-weight:400">(se guardan solo en este dispositivo)</span></label>
        <textarea class="form-input" id="msj-cfg-pago" style="min-height:80px" placeholder="Titular, banco, cuenta y CLABE"></textarea>
        <label class="form-label" style="margin-top:10px">Costo de la visita de medición ($)</label>
        <input type="text" class="form-input" id="msj-cfg-costo" inputmode="numeric" placeholder="500">
        <label class="form-label" style="margin-top:10px">Liga para dejar reseña</label>
        <input type="text" class="form-input" id="msj-cfg-resena" placeholder="https://g.page/...">
        <label class="form-label" style="margin-top:10px">Tu nombre en los mensajes</label>
        <input type="text" class="form-input" id="msj-cfg-firma" placeholder="Mauricio">
        <button type="button" class="btn btn-navy" style="width:100%;margin-top:12px" onclick="msjCfgGuardar()">Guardar mis datos</button>
      </div>
    </details>

    <div class="tono-row" id="msj-tono"></div>

    <div class="cat-tabs" id="msj-cat-tabs"></div>
    <div id="msj-lista-plantillas"></div>
  </div>
</div>

<div class="modal-overlay" id="msj-modal">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

    </div>
    <label class="form-label">Teléfono del cliente <span style="color:var(--gray-400);font-weight:400">(10 dígitos, sin espacios)</span></label>

    <textarea class="form-input" id="msj-texto" oninput="msjActualizarAviso()"></textarea>
    <div class="msj-aviso" id="msj-aviso"></div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button type="button" class="btn btn-outline" style="flex:1" onclick="msjCopiar()">📋 Copiar</button>
      <button type="button" class="btn btn-primary" style="flex:1.4" onclick="msjAbrirWhatsapp()">💬 Abrir WhatsApp</button>

</div>

var MSJ_FOLIO_SEL = null; // {folio, cliente, tel, monto, saldo}
var MSJ_CAT_ACTIVA = 'contacto';
var MSJ_TONO = 'u';       // 'u' = usted, 't' = tú
try { MSJ_TONO = localStorage.getItem('barrcan_msj_tono') === 't' ? 't' : 'u'; } catch (e) {}

// ── Mis datos (se guardan en el dispositivo, no en el código) ─────
function msjCfgLeer() {
  try { return JSON.parse(localStorage.getItem('barrcan_msj_cfg') || '{}') || {}; }
  catch (e) { return {}; }
}
function msjCfgCargar() {
  var c = msjCfgLeer();
  document.getElementById('msj-cfg-pago').value = c.pago || '';
  document.getElementById('msj-cfg-costo').value = c.costo || '500';
  document.getElementById('msj-cfg-resena').value = c.resena || '';
  document.getElementById('msj-cfg-firma').value = c.firma || 'Mauricio';
}
function msjCfgGuardar() {
  var c = {
    pago: document.getElementById('msj-cfg-pago').value.trim(),
    costo: document.getElementById('msj-cfg-costo').value.replace(/[^\d.]/g, ''),
    resena: document.getElementById('msj-cfg-resena').value.trim(),
    firma: document.getElementById('msj-cfg-firma').value.trim()
  };
  try { localStorage.setItem('barrcan_msj_cfg', JSON.stringify(c)); toast('✅ Datos guardados en este dispositivo'); }
  catch (e) { toast('⚠️ No se pudo guardar en este dispositivo'); }
}

// ── Tratamiento usted / tú ────────────────────────────────────────
function msjRenderTono() {
  var cont = document.getElementById('msj-tono');
  cont.innerHTML = '<span>Tratamiento:</span>'
    + '<button type="button" class="cat-tab' + (MSJ_TONO === 'u' ? ' active' : '') + '" onclick="msjSetTono(\'u\')">Usted</button>'
    + '<button type="button" class="cat-tab' + (MSJ_TONO === 't' ? ' active' : '') + '" onclick="msjSetTono(\'t\')">Tú</button>';
}
function msjSetTono(t) {
  MSJ_TONO = t;
  try { localStorage.setItem('barrcan_msj_tono', t); } catch (e) {}
  msjRenderTono();
  msjRenderLista();
}
function msjTextoPlantilla(p) { return (MSJ_TONO === 't' ? p.t : p.u) || p.u; }

function msjRenderTabs() {
  var cont = document.getElementById('msj-cat-tabs');
  cont.innerHTML = Object.keys(MSJ_CATEGORIAS).map(function(k) {
    var c = MSJ_CATEGORIAS[k];
    return '<button type="button" class="cat-tab' + (k === MSJ_CAT_ACTIVA ? ' active' : '') + '" onclick="msjCambiarCat(\'' + k + '\')">' + c.emoji + ' ' + c.nombre + '</button>';
  }).join('');
}

function msjCambiarCat(cat) {
  MSJ_CAT_ACTIVA = cat;
  msjRenderTabs();
  msjRenderLista();
}

function msjRenderLista() {
  var cont = document.getElementById('msj-lista-plantillas');
  var items = MSJ_PLANTILLAS.filter(function(p) { return p.cat === MSJ_CAT_ACTIVA; });
  cont.innerHTML = items.map(function(p) {
    var idx = MSJ_PLANTILLAS.indexOf(p);
    return '<div class="plantilla-card" onclick="msjAbrirPlantilla(' + idx + ')">'
      + '<div class="plantilla-titulo">' + esc(p.titulo) + '</div>'
      + '<div class="plantilla-cuando">' + esc(p.cuando || '') + '</div>'
      + '</div>';
  }).join('');
}

async function msjBuscarFolio() {
  var q = (document.getElementById('msj-folio-buscar').value || '').trim();
  if (q.length === 0) {
    MSJ_FOLIO_SEL = null;
    document.getElementById('msj-folio-seleccionado').style.display = 'none';
    document.getElementById('msj-folios-datalist').innerHTML = '';
    return;
  }
  if (q.length < 2 || !sb()) return;
  try {
    var res = await sb().from('presupuestos_atrasados').select('folio,cliente,tel,monto,saldo,eliminado')
      .or('folio.ilike.%' + q + '%,cliente.ilike.%' + q + '%').limit(20);
    if (res.error) return;
    res.data = (res.data || []).filter(function(p) { return !p.eliminado; });
    document.getElementById('msj-folios-datalist').innerHTML = (res.data || [])
      .map(function(p) { return '<option value="' + esc(p.folio) + ' — ' + esc(p.cliente) + '">'; }).join('');

    var match = (res.data || []).filter(function(p) { return (p.folio + ' — ' + p.cliente) === q || p.folio === q; })[0];
    if (match) {
      MSJ_FOLIO_SEL = match;
      var div = document.getElementById('msj-folio-seleccionado');
      div.style.display = 'block';
      div.innerHTML = '✅ ' + esc(match.cliente) + (match.tel ? ' · 📱 ' + esc(match.tel) : ' · <span style="color:var(--red)">sin teléfono guardado</span>');
    }
  } catch (e) { console.warn('[BarrCan] Error buscando folio:', e.message); }
}

function msjSaludo() {
  var h = new Date().getHours();
  if (h < 12) return 'Buen día';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

function msjMoney(n) {
  if (n === undefined || n === null || n === '' || isNaN(Number(n))) return '';
  return '$' + fmt(n);
}

// Lo que no se puede llenar solo queda entre [corchetes] para escribirlo a mano
var MSJ_MARCADORES = {
  cliente: '[cliente]', folio: '[folio]', monto: '[monto]', saldo: '[saldo]',
  datos_pago: '[datos de pago]', fecha: '[fecha y hora]', alt: '[fecha alterna]',
  anticipo: '[monto del anticipo]', liga_resena: '[liga de reseña]'
};

function msjRellenar(texto) {
  var d = MSJ_FOLIO_SEL || {};
  var cfg = msjCfgLeer();
  var manual = (document.getElementById('msj-nombre-manual').value || '').trim();
  var costo = cfg.costo ? Number(cfg.costo) : 500;
  var vals = {
    cliente: d.cliente || manual || '',
    folio: d.folio || '',
    monto: msjMoney(d.monto),
    saldo: (Number(d.saldo) > 0) ? msjMoney(d.saldo) : '',
    saludo: msjSaludo(),
    firma: cfg.firma || 'Mauricio',
    costo_visita: msjMoney(costo > 0 ? costo : 500),
    datos_pago: cfg.pago || '',
    liga_garantia: MSJ_LIGA_GARANTIA,
    liga_resena: cfg.resena || '',
    incluye: 'fabricación, envío e instalación'
  };
  return texto.replace(/\{([a-z_]+)\}/g, function(m, k) {
    if (vals[k]) return vals[k];
    return MSJ_MARCADORES[k] || m;
  });
}

// Avisa si todavía hay campos entre [corchetes]
function msjCamposPendientes() {
  var t = document.getElementById('msj-texto').value || '';
  var m = t.match(/\[[^\]\n]{2,40}\]/g) || [];
  var uniq = [];
  m.forEach(function(x) { if (uniq.indexOf(x) < 0) uniq.push(x); });
  return uniq;
}
function msjActualizarAviso() {
  var el = document.getElementById('msj-aviso');
  var p = msjCamposPendientes();
  if (p.length) {
    el.style.display = 'block';
    el.textContent = '⚠️ Todavía falta llenar: ' + p.join(', ');
  } else {
    el.style.display = 'none';
  }
}

function msjAbrirPlantilla(idx) {
  var p = MSJ_PLANTILLAS[idx];
  document.getElementById('msj-modal-titulo').textContent = p.titulo;
  document.getElementById('msj-texto').value = msjRellenar(msjTextoPlantilla(p));
  document.getElementById('msj-tel').value = (MSJ_FOLIO_SEL && MSJ_FOLIO_SEL.tel) ? MSJ_FOLIO_SEL.tel.replace(/\D/g, '') : '';
  document.getElementById('msj-modal').classList.add('visible');
  msjActualizarAviso();
}

function msjCerrarModal() {
  document.getElementById('msj-modal').classList.remove('visible');
}

function msjCopiar() {
  var txt = document.getElementById('msj-texto').value;
  navigator.clipboard.writeText(txt).then(function() {
    toast('✅ Copiado -- pégalo donde lo necesites');
  }).catch(function() {
    toast('No se pudo copiar automático -- selecciona el texto a mano');
  });
}

function msjAbrirWhatsapp() {
  var tel = (document.getElementById('msj-tel').value || '').replace(/\D/g, '');
  var txt = document.getElementById('msj-texto').value;
  if (!tel || tel.length < 10) { toast('⚠️ Falta un teléfono válido (10 dígitos)'); return; }
  var pend = msjCamposPendientes();
  if (pend.length && !confirm('Todavía hay campos sin llenar: ' + pend.join(', ') + '\n\n¿Abrir WhatsApp así?')) return;
  var telConLada = tel.length === 10 ? '52' + tel : tel;
  window.open('https://wa.me/' + telConLada + '?text=' + encodeURIComponent(txt), '_blank');
}

document.addEventListener('DOMContentLoaded', function() {
  detectarConexion();
  msjCfgCargar();
  msjRenderTono();
  msjRenderTabs();
  msjRenderLista();
});
