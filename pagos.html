<head>

<title>BarrCan &middot; Pagos</title>
<!--
  BARRCAN · MÓDULO: PAGOS (standalone)
  VERSIÓN : v4.12
  FECHA   : 2026-08-24
  v4.12 — FIX: la descripción de lo que se está cobrando aparecía en
    el recibo la primera vez que se imprimía, pero al REimprimir
    (pagoEditarReimprimir) ya no salía. Causa real: la descripción
    nunca se guardaba en la base de datos, solo vivía en pantalla al
    momento del primer print. Se agregó la columna pagos.descripcion,
    se guarda desde el inicio (pago individual y múltiple), y se lee
    de ahí al reimprimir en vez de dejarla vacía.
  VERSIÓN : v4.11
  FECHA   : 2026-08-23
  v4.11 — FIX crítico de pérdida de datos, mismo patrón que se
    encontró y corrigió en entregas.html: guardarOffline() tenía un
    catch(e){} vacío -- si el pago no se podía guardar NI en el
    servidor NI localmente (memoria llena, modo incógnito), se perdía
    por completo sin ningún aviso. Caso real: el pago de liquidación
    del folio CACN-082B nunca llegó a la base de datos así. Ahora
    avisa con una alerta bloqueante para poder recuperarlo a mano.
  VERSIÓN : v4.10
  FECHA   : 2026-08-23
  v4.10 — Disponibilidad real de Mercado Libre calculada sola: al
    elegir esa forma de pago (con un presupuesto ya seleccionado),
    busca la fecha de entrega real en reportes_entrega/
    entregas_instalacion para ese folio y calcula "disponible desde"
    (entrega + 5 días, que es cuando ML realmente libera el saldo --
    NO desde la fecha de venta). Si el folio aún no tiene entrega
    registrada, avisa que el conteo no ha empezado. Nota siempre
    visible de que esto se puede extender hasta 28 días naturales si
    el cliente mete un reclamo. Además, el % de comisión default bajó
    de 21% a 19%, según el promedio real observado en 3 ventas reales
    (13.5%–19.5% de cargo por venta + ~9% de impuestos aparte).
  VERSIÓN : v4.9
  FECHA   : 2026-08-22
  v4.9 — Nueva forma de pago "🛒 Mercado Libre": al elegirla aparece
    un campo de % de comisión (default desde config_precios, editable
    por si varía) y un "Neto real que te llega" calculado en vivo --
    ESTO ES SOLO PARA MAU, nunca aparece en el recibo impreso (el
    recibo sigue mostrando el monto completo cobrado, como debe verlo
    el cliente). El % de comisión se guarda en la nueva columna
    pagos.comision_ml_pct para poder calcular la utilidad real en
    reportes.html más adelante.
  VERSIÓN : v4.8
  FECHA   : 2026-08-20
  v4.8 — FIX: presupuestos "entregado" con saldo pendiente desaparecían
    del dropdown de pagos + pregunta de entrega al liquidar:
    - FIX: ESTADOS_CON_SALDO no incluía 'entregado' -- en cuanto un
      presupuesto pasaba a entregado/instalado, se volvía invisible
      para pagos.html aunque siguiera con saldo real > 0. Caso típico:
      se entrega/instala pero el cliente (empresa) paga después por
      trámite administrativo (transferencia, cuenta corporativa). Se
      agregó 'entregado' a la lista para que sigan apareciendo.
    - Nuevo: al registrar un pago (individual o múltiple) que deja el
      saldo en $0, ya no se asume automáticamente "pendiente_entrega"
      -- se pregunta si el trabajo ya fue entregado/instalado. Antes
      esto podía revertir por error un presupuesto que en realidad ya
      estaba entregado, solo porque el pago llegó tarde.
    - Requiere columna nueva en Supabase:
      ALTER TABLE barrcan.presupuestos_atrasados
      ADD COLUMN IF NOT EXISTS nota_pago_pendiente text;
      (se llena desde entregas.html cuando se entrega sin cobrar por
      trámite administrativo, y se limpia sola aquí cuando el pago
      finalmente se registra).
  VERSIÓN : v4.7
  FECHA   : 2026-08-07
  v4.7 — FIX: logo del header roto (base64 corrupto):
    - El header traía el logo embebido como base64 -- ese blob estaba
      truncado (padding inválido, no decodifica), reventado otra vez al
      construir v4.6 sobre una base vieja que no traía el fix de logo
      del 21-jul (URL + respaldo). Se repite el mismo patrón que ya se
      aplicó en ordenes.html/clientes.html/historial.html/entregas.html:
      logo por URL (assets/logo-icono.jpg) con respaldo fijo
      _LOGO_ICONO_B64 vía onerror, para que nunca vuelva a pasar esto
      por un copy/paste cortado.
    - El recibo impreso (2 plantillas) ya no depende de _LOGO_SRC
      (tomado del <img> del header en tiempo de ejecución, frágil) --
      ahora usa siempre _LOGO_ICONO_B64 directamente, para que el
      recibo funcione offline sin importar qué haya cargado la pantalla.
  VERSIÓN : v4.6
  FECHA   : 2026-07-29
  v4.6 — Pago que cubre varios proyectos + reconciliación de versión:
    - El archivo base que se estaba usando para editar se había quedado
      en v4.1 (v4.2-v4.5 se hicieron en otra sesión y nunca llegaron a
      esta copia) -- se recuperaron esos 3 cambios antes de agregar lo
      nuevo, para no perderlos:
        · v4.2/v4.3: el modal "Editar pago" ahora permite subir, cambiar
          o quitar la foto del comprobante (antes solo se podía adjuntar
          al crear el pago).
        · v4.4: FIX crítico -- liquidar un saldo ya NO marca el
          presupuesto como "entregado" (esa palabra la usa entregas.html
          para "ya se instaló físicamente"). Ahora pasa a
          "pendiente_entrega" -- ya pagado, falta la instalación.
        · v4.5: el recibo impreso ahora trae al pie "¿Requiere factura?
          Solicítela por correo a ventas@barrcan.com.mx".
    - Nuevo botón "Este pago cubre varios proyectos" -- antes no había
      forma de registrar un solo pago del cliente que liquida 2+
      presupuestos sin generar un recibo aparte por cada uno.
    - Modo múltiple: se busca al cliente, se seleccionan sus proyectos
      con saldo, se ingresa el monto total recibido y se reparte
      (automático o editable a mano) entre los seleccionados.
    - Se genera UN solo recibo (folioRB) con el desglose por proyecto,
      pero cada presupuesto sigue actualizando su propio saldo/estado
      real por separado (necesario para no perder el control financiero
      individual de cada obra). Misma corrección de v4.4 aplicada aquí.
  VERSIÓN : v4.5
  FECHA   : 2026-07-16
  v4.5 — Leyenda de factura en el recibo (recuperado, ver v4.6 arriba)
  VERSIÓN : v4.4
  FECHA   : 2026-07-13
  v4.4 — Fix estado al liquidar (recuperado, ver v4.6 arriba)
  VERSIÓN : v4.3
  FECHA   : 2026-07-12
  v4.3 — Foto de comprobante editable (recuperado, ver v4.6 arriba)
  VERSIÓN : v4.2
  FECHA   : 2026-07-12
  v4.2 — N° de recibo editable + ajustes de visualización
  VERSIÓN : v4.1
  FECHA   : 2026-07-11
  v4.1 — 2026-07-11
    - ADD: Paginación — muestra solo 10 pagos inicialmente
    - ADD: Botón "Cargar más" cuando hay más de 10
    - ADD: Botón "Ver todos" cuando hay más de 50
    - ADD: Contador "mostrando X de Y"
    - ADD: Scroll suave al cargar más
  v4.0 — 2026-07-11
    - ADD: Cálculo de saldo en vivo desde SUM(pagos.monto)
    - ADD: presupuesto_id en pagos para enlace directo
    - FIX: saldo ya no se resta del caché desactualizado
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --navy: #1B3A5C;
  --blue: #2E6DA4;
  --gold: #C8923A;
  --gold-light: #E8B96A;
  --orange: #FF6600;
  --white: #FFFFFF;
  --off-white: #F7F5F0;
  --gray-100: #F0EDE8;
  --gray-200: #DDD9D2;
  --gray-400: #9A9590;
  --gray-600: #5A5652;
  --green: #2D7D46;
  --red: #C0392B;
  --amber: #E67E22;
  --shadow-sm: 0 2px 8px rgba(27,58,92,0.08);
  --shadow-md: 0 8px 32px rgba(27,58,92,0.14);
  --shadow-lg: 0 20px 60px rgba(27,58,92,0.20);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--navy);
  overscroll-behavior: none;
}

#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header {
  background: var(--navy);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  position: relative;
  z-index: 100;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 16px;
  color: var(--navy);
  letter-spacing: -0.5px;
  overflow: hidden;
}
.logo-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.logo-text {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--white);
  letter-spacing: 0.5px;
}
.logo-sub {
  font-size: 9px;
  color: var(--gold-light);
  letter-spacing: 2px;
  text-transform: uppercase;
  display: block;
  margin-top: -3px;
}
.offline-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(200,146,58,0.15);
  border: 1px solid rgba(200,146,58,0.3);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--gold-light);
  font-weight: 500;
}
.offline-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-light);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}
.section-sub {
  font-size: 12px;
  color: var(--gray-400);
  margin-bottom: 16px;
  letter-spacing: 0.3px;
}

.wizard-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.wizard-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wizard-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gray-200);
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-600);
  margin-bottom: 5px;
  letter-spacing: 0.3px;
}
.form-input, .form-select {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--navy);
  background: var(--off-white);
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
  appearance: none;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(46,109,164,0.12);
  background: var(--white);
}
.input-unit {
  position: relative;
}
.input-unit .form-input { padding-right: 48px; }
.input-unit-label {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-400);
  letter-spacing: 0.5px;
  pointer-events: none;
}
.form-select-wrap { position: relative; }
.form-select-wrap::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--blue);
  pointer-events: none;
  font-size: 14px;
}
select.form-select { padding-right: 36px; cursor: pointer; }

.pf-btn {
  padding: 10px 6px;
  border: 2px solid var(--gray-200);
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-400);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.pf-btn.active {
  border-color: var(--blue);
  background: rgba(46,109,164,0.08);
  color: var(--blue);
}
.pf-btn:active { transform: scale(0.95); }

.btn-cargar-mas {
  padding: 10px 20px;
  background: var(--off-white);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  color: var(--gray-600);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  width: 100%;
}
.btn-cargar-mas:hover {
  background: var(--gray-100);
  border-color: var(--gray-400);
}
.btn-cargar-mas:active {
  transform: scale(0.98);
}
.btn-ver-todos {
  padding: 6px 12px;
  background: none;
  border: none;
  color: var(--blue);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
}
.btn-ver-todos:hover {
  color: var(--navy);
}

.btn-registrar {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  background: linear-gradient(135deg, #27AE60, #2ECC71);
  border: none;
  border-radius: var(--radius);
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(39,174,96,0.35);
  transition: all 0.15s;
}
.btn-registrar:active { transform: scale(0.97); }
.btn-registrar:disabled { background: var(--gray-200); box-shadow: none; color: var(--gray-400); }

.btn-edit {
  padding: 5px 10px;
  background: rgba(200,146,58,0.08);
  border: 1.5px solid rgba(200,146,58,0.3);
  border-radius: 8px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.btn-refresh {
  padding: 5px 10px;
  background: rgba(46,109,164,0.08);
  border: 1.5px solid rgba(46,109,164,0.25);
  border-radius: 8px;
  color: var(--blue);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.pago-pres-card {
  display: none;
  background: rgba(39,174,96,0.06);
  border: 1.5px solid rgba(39,174,96,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 12px;
}
.pago-pres-card.visible { display: block; }
.pago-pres-info {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
}
.pago-pres-label {
  font-size: 10px;
  color: var(--green);
  font-weight: 700;
  margin-bottom: 2px;
}
.pago-pres-clear {
  font-size: 11px;
  color: var(--gray-400);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 2px 0;
}

.pago-saldo-display {
  background: var(--gray-100);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  color: var(--red);
}
.pago-saldo-display.saldo-ok { color: var(--green); }
.pago-saldo-display.saldo-medio { color: var(--gold); }

.pago-foto-preview {
  display: none;
  margin-bottom: 8px;
  position: relative;
  display: inline-block;
}
.pago-foto-preview.visible { display: inline-block; }
.pago-foto-img {
  max-width: 100%;
  max-height: 200px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--gray-200);
}
.pago-foto-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  font-size: 12px;
  cursor: pointer;
}
.pago-error {
  display: none;
  color: var(--red);
  font-size: 12px;
  background: rgba(192,57,43,0.06);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-top: 10px;
}
.pago-error.visible { display: block; }

/* Historial */
.pago-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 9px 0;
  border-bottom: 1px solid var(--gray-200);
}
.pago-item.pendiente {
  background: rgba(192,57,43,0.04);
  border-left: 3px solid var(--red);
  padding-left: 8px;
}
.pago-item-info { flex: 1; }
.pago-item-titulo {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
}
.pago-item-detalle {
  font-size: 10px;
  color: var(--gray-400);
}
.pago-item-monto {
  font-family: monospace;
  font-size: 15px;
  font-weight: 800;
  color: var(--green);
}
.pago-item-edit {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--gray-200);
  border-radius: 6px;
  background: none;
  color: var(--gray-400);
  font-size: 12px;
  cursor: pointer;
}
.pago-pend-tag {
  font-size: 9px;
  font-weight: 700;
  color: var(--red);
  margin-bottom: 2px;
}
.pago-hoy {
  background: rgba(39,174,96,0.08);
  border: 1px solid rgba(39,174,96,0.2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pago-hoy-label {
  font-size: 11px;
  color: var(--green);
  font-weight: 700;
}
.pago-hoy-monto {
  font-size: 15px;
  font-weight: 800;
  color: var(--green);
}
.pago-rb-label {
  font-size: 9px;
  color: var(--blue);
  font-family: monospace;
  margin-left: 4px;
}

/* Modal post-pago */
.pago-post-ov {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 900;
  backdrop-filter: blur(4px);
  align-items: flex-end;
}
.pago-post-ov.visible { display: flex; }
.pago-post-card {
  width: 100%;
  background: var(--white);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 36px;
}
.pago-post-handle {
  width: 40px;
  height: 4px;
  background: var(--gray-200);
  border-radius: 2px;
  margin: 0 auto 14px;
}
.pago-post-titulo {
  font-size: 17px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}
.pago-post-sub {
  font-size: 11px;
  color: var(--gray-400);
  margin-bottom: 16px;
}
.pago-post-btn {
  width: 100%;
  padding: 13px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.pago-post-btn:active { transform: scale(0.97); }
.pago-post-btn-primary {
  background: rgba(46,109,164,0.08);
  border: 1.5px solid var(--blue);
  color: var(--blue);
}
.pago-post-btn-wa {
  background: #25D366;
  color: white;
}
.pago-post-btn-close {
  background: none;
  border: 1.5px solid var(--gray-200);
  color: var(--gray-600);
}

/* Modal editar */
.pago-edit-ov {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 800;
  backdrop-filter: blur(3px);
}
.pago-edit-ov.visible { display: block; }
.pago-edit-card {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  max-height: 85vh;
  overflow-y: auto;
}
.pago-edit-handle {
  width: 40px;
  height: 4px;
  background: var(--gray-200);
  border-radius: 2px;
  margin: 0 auto 14px;
}
.pago-edit-titulo {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 14px;
}
.pago-edit-folio-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
.pago-edit-folio-prefix {
  padding: 10px 10px;
  background: var(--gray-100);
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-400);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  border-right: none;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}
.pago-edit-folio-input {
  flex: 1;
  padding: 10px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
  background: var(--off-white);
  outline: none;
}
.pago-edit-folio-input:focus {
  border-color: var(--blue);
  background: var(--white);
}
.pago-edit-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.pago-edit-btn {
  flex: 1;
  min-width: 120px;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.pago-edit-btn:active { transform: scale(0.97); }
.pago-edit-btn-save {
  background: var(--navy);
  color: white;
}
.pago-edit-btn-print {
  background: rgba(39,174,96,0.08);
  border: 1.5px solid var(--green);
  color: var(--green);
}
.pago-edit-btn-cancel {
  width: 100%;
  padding: 11px;
  background: none;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm);
  color: var(--gray-600);
  font-size: 13px;
  cursor: pointer;
  margin-top: 4px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.25s;
  z-index: 9999;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.toast.show { opacity: 1; }

/* Print styles */
@media print {
  #app, .header, .export-bar, .toast,
  .barra-seleccion, #modal-overlay, #modal-edicion,
  #modal-contrato-overlay, #modal-contrato,
  #entrega-overlay, .pago-post-ov, .pago-edit-ov { display: none !important; }
  #print-area, #ent-print-area {
    display: block !important;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: white;
  }
  body { margin: 0; padding: 0; background: white; }
  @page { margin: 12mm 14mm; size: letter; }
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-logo">
      <div class="logo-mark">
        <img src="https://barrcan.github.io/barrcan-app/assets/logo-icono.jpg" id="header-logo-img" onerror="this.onerror=null;this.src=_LOGO_ICONO_B64;" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div><span class="logo-text">BarrCan</span><span class="logo-sub">Canceleria &middot; Campo</span></div>
    </div>
    <div class="offline-badge"><div class="offline-dot"></div>
      <span id="conn-status">Offline-First</span>
      <span style="font-size:9px;color:rgba(255,255,255,0.3);margin-left:4px">Pagos v4.1</span>

  </div>

  <div class="content">
    <p class="section-title">Registro de Pagos</p>
    <p class="section-sub">Captura pagos &middot; genera recibo RB-100 &middot; env&iacute;a por WhatsApp</p>

    <!-- HISTORIAL -->
    <div class="wizard-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="wizard-title" style="margin:0">Pagos recientes</div>
        <div style="display:flex;gap:6px">
          <button onclick="editarFolioRB()" class="btn-edit" title="Editar número de folio RB">N° RB</button>
          <button onclick="pagosCargar()" class="btn-refresh">Actualizar</button>
        </div>
      </div>
      <div id="pagos-contador" style="font-size:11px;color:var(--gray-400);margin-bottom:6px"></div>
      <div id="pagos-lista"><div style="text-align:center;padding:14px;color:var(--gray-400);font-size:13px">Cargando...</div></div>
    </div>

    <!-- FORMULARIO -->
    <div class="wizard-card">
      <div class="wizard-title">Registrar pago</div>

      <button type="button" id="pago-btn-multi" onclick="pagoToggleMulti()"
        style="width:100%;padding:10px;margin-bottom:12px;background:rgba(142,68,173,.06);border:1.5px solid rgba(142,68,173,.3);border-radius:8px;color:#8E44AD;font-size:12px;font-weight:700;cursor:pointer">
        &#129513; Este pago cubre varios proyectos
      </button>

      <!-- MODO NORMAL: un solo presupuesto -->
      <div id="pago-modo-normal">
      <label class="form-label">Presupuesto aprobado</label>
      <select id="pago-pres" class="form-select" onchange="seleccionarPres()" style="margin-bottom:8px">
        <option value="">&mdash; Selecciona presupuesto aprobado &mdash;</option>
      </select>
      <div id="pago-pres-card" class="pago-pres-card">
        <div class="pago-pres-label">VINCULADO</div>
        <div id="pago-pres-info" class="pago-pres-info"></div>
        <button onclick="clearPres()" class="pago-pres-clear">Desvincular</button>
      </div>

      <label class="form-label">Folio del presupuesto</label>
      <input type="text" id="pago-folio" class="form-input" placeholder="CACN-094B-260610-32J" style="font-family:'DM Mono',monospace;font-size:13px">
      <label class="form-label">Cliente</label>
      <input type="text" id="pago-cliente" class="form-input" placeholder="Nombre del cliente">
      <label class="form-label">Tel&eacute;fono</label>
      <input type="tel" id="pago-tel" class="form-input" placeholder="55 1234 5678" inputmode="tel">
      <label class="form-label">Descripci&oacute;n de la obra</label>
      <input type="text" id="pago-desc" class="form-input" placeholder="Ej: Cancel ba&ntilde;o frameless 9mm...">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Total obra</label>
          <div class="input-unit">
            <input type="number" id="pago-total" class="form-input" placeholder="0" min="0" inputmode="decimal" oninput="actualizarSaldo()">
            <span class="input-unit-label">$</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Pagado antes</label>
          <div class="input-unit">
            <input type="number" id="pago-ant" class="form-input" placeholder="0" min="0" inputmode="decimal" oninput="actualizarSaldo()" readonly style="background:var(--gray-100);cursor:not-allowed">
            <span class="input-unit-label">$</span>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Monto de este pago *</label>
          <div class="input-unit">
            <input type="number" id="pago-monto" class="form-input" placeholder="0" min="0" inputmode="decimal" oninput="actualizarSaldo(); pagoActualizarNetoML();">
            <span class="input-unit-label">$</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Saldo pendiente <span id="saldo-real-badge" style="font-size:9px;color:var(--green);font-weight:400">(en vivo)</span></label>
          <div id="pago-saldo" class="pago-saldo-display">$0</div>
        </div>
      </div>
      </div>

      <!-- MODO MÚLTIPLE: un pago que liquida varios presupuestos ──
           El cliente paga una sola cantidad que cubre 2+ proyectos.
           Se genera UN solo recibo (folioRB), pero internamente sigue
           habiendo un registro de "pagos" por cada presupuesto que se
           liquida, porque cada uno lleva su propio saldo real. -->
      <div id="pago-modo-multi" style="display:none">
        <label class="form-label">Cliente <span style="font-weight:400;color:var(--gray-400)">(para filtrar sus proyectos)</span></label>
        <input type="text" id="pago-multi-buscar" class="form-input" placeholder="Nombre del cliente..." oninput="pagoMultiRenderLista()" style="margin-bottom:8px">
        <div id="pago-multi-lista" style="max-height:240px;overflow-y:auto;margin-bottom:10px"></div>

        <label class="form-label">Monto total recibido del cliente *</label>
        <div class="input-unit" style="margin-bottom:6px">
          <input type="number" id="pago-multi-total" class="form-input" placeholder="0" min="0" inputmode="decimal" oninput="pagoMultiActualizar()">
          <span class="input-unit-label">$</span>
        </div>
        <button type="button" onclick="pagoMultiAutoDistribuir()" style="width:100%;padding:9px;margin-bottom:12px;background:rgba(46,109,164,.06);border:1.5px solid rgba(46,109,164,.25);border-radius:8px;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer">
          Repartir autom&aacute;ticamente entre los seleccionados
        </button>

        <div id="pago-multi-desglose" style="margin-bottom:10px"></div>
        <div id="pago-multi-resumen" style="background:#F8F9FA;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px"></div>

        <label class="form-label">Cliente (para el recibo)</label>
        <input type="text" id="pago-multi-cliente" class="form-input" placeholder="Nombre del cliente" style="margin-bottom:8px">
        <label class="form-label">Tel&eacute;fono</label>
        <input type="tel" id="pago-multi-tel" class="form-input" placeholder="55 1234 5678" inputmode="tel">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Fecha *</label>
          <input type="date" id="pago-fecha" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Concepto</label>
          <select id="pago-concepto" class="form-select">
            <option value="anticipo">Anticipo 50%</option>
            <option value="segundo_pago">2&deg; Pago 35%</option>
            <option value="liquidacion">Liquidaci&oacute;n 15%</option>
            <option value="pago_total">Pago total</option>
            <option value="otro">Otro</option>
          </select>
        </div>
      </div>

      <label class="form-label">Forma de pago</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
        <button class="pf-btn active" data-forma="transferencia" onclick="selForma(this)">Transferencia</button>
        <button class="pf-btn" data-forma="efectivo" onclick="selForma(this)">Efectivo</button>
        <button class="pf-btn" data-forma="tarjeta" onclick="selForma(this)">Tarjeta</button>
      </div>
      <div style="margin-bottom:12px">
        <button class="pf-btn" data-forma="mercado_libre" onclick="selForma(this)" style="width:100%">🛒 Mercado Libre</button>
      </div>

      <div id="pago-ml-group" style="display:none;background:rgba(200,146,58,.08);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:12px">
        <label class="form-label" style="margin-top:0">% comisión de Mercado Libre <small style="font-weight:400;color:var(--gray-400)">(solo para ti, nunca sale en el recibo)</small></label>
        <input type="number" id="pago-comision-ml" class="form-input" inputmode="decimal" step="0.5" oninput="pagoActualizarNetoML()">
        <div id="pago-ml-neto" style="font-size:12px;color:var(--gray-600);margin-top:6px">Neto real que te llega: —</div>
        <div id="pago-ml-disponible" style="font-size:11.5px;color:var(--navy);margin-top:8px;padding-top:8px;border-top:1px solid rgba(200,146,58,.25)">📅 Disponibilidad: —</div>
      </div>

      <label class="form-label">Notas / referencia de transferencia</label>
      <input type="text" id="pago-notas" class="form-input" placeholder="Referencia bancaria, observaciones...">

      <label class="form-label">N&uacute;m. de factura (opcional)</label>
      <input type="text" id="pago-factura" class="form-input" placeholder="FAC-2026-001 &mdash; dejar vac&iacute;o si no aplica">

      <label class="form-label">Foto del comprobante</label>
      <input type="file" id="pago-foto-input" accept="image/*" style="display:none" onchange="pagoCargarFoto(this)">
      <button onclick="document.getElementById('pago-foto-input').click()" style="width:100%;padding:12px;background:var(--off-white);border:2px dashed var(--gray-200);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--gray-400);font-family:'DM Sans',sans-serif;font-weight:600;margin-bottom:8px">
        Subir foto del comprobante
      </button>
      <div id="pago-foto-preview" class="pago-foto-preview">
        <img id="pago-foto-img" class="pago-foto-img">
        <button onclick="pagoQuitarFoto()" class="pago-foto-remove">x</button>
      </div>

      <div id="pago-error" class="pago-error"></div>

      <button id="pago-btn" class="btn-registrar" onclick="pagoGuardarDispatch()">
        Registrar Pago y Generar Recibo
      </button>
    </div>
  </div>
</div>

<!-- Modal post-pago -->
<div id="pago-post-ov" class="pago-post-ov">
  <div class="pago-post-card">
    <div class="pago-post-handle"></div>
    <div id="ppo-titulo" class="pago-post-titulo"></div>
    <div class="pago-post-sub">&iquest;Qu&eacute; deseas hacer ahora?</div>

  </div>
</div>

<script>
// ── Supabase ──────────────────────────────────────────────────────
var SB_URL = 'https://rmngjtzupukhylxlgcww.supabase.co';
var SB_KEY = 'sb_publishable_udZ-NNvSLrSaDk2dBRPwMg_IQCZ4N2I';
var _sbClient = null;
function sb() {
  if (!_sbClient && window.supabase) {
    _sbClient = window.supabase.createClient(SB_URL, SB_KEY, {
      db: { schema: 'barrcan' },
      auth: { persistSession: true, storageKey: 'barrcan_auth' }
    });
  }
  return _sbClient;
}

// ── Conexión ──────────────────────────────────────────────────────
var SYNC = { online: navigator.onLine };
window.addEventListener('online',  function() { SYNC.online = true;  detectarConexion(); pagosCargar(); pagoReintentarPendientes(); });
window.addEventListener('offline', function() { SYNC.online = false; detectarConexion(); });

var APP_VERSION = 'v4.12';
function detectarConexion() {
  var badge = document.getElementById('conn-status');
  if (badge) badge.textContent = (navigator.onLine ? 'Online' : 'Offline-First') + ' \u00b7 ' + APP_VERSION;
}

// ── Helpers ───────────────────────────────────────────────────────
function fmt(n) { return Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

function toast(msg, dur) {
  dur = dur || 2800;
  var el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div'); el.id = '_toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, dur);
}

// ── Estado ────────────────────────────────────────────────────────
var PAGOS_CACHE = JSON.parse(localStorage.getItem('barrcan_pagos_cache') || '[]');
var PRES_LIST   = [];
var FORMA_SEL   = 'transferencia';
var PRES_SEL    = null;

// ── Modo múltiple: un pago que liquida varios presupuestos a la vez ──
var PAGO_MODO = 'normal'; // 'normal' | 'multi'
var PAGO_MULTI_SEL = {}; // { id: { p, aplicado } }

function pagoToggleMulti() {
  PAGO_MODO = (PAGO_MODO === 'multi') ? 'normal' : 'multi';
  document.getElementById('pago-modo-normal').style.display = PAGO_MODO === 'multi' ? 'none' : 'block';
  document.getElementById('pago-modo-multi').style.display  = PAGO_MODO === 'multi' ? 'block' : 'none';
  var btn = document.getElementById('pago-btn-multi');
  btn.textContent = PAGO_MODO === 'multi' ? '✕ Cancelar pago múltiple' : '🤝 Este pago cubre varios proyectos';
  btn.style.background = PAGO_MODO === 'multi' ? 'rgba(192,57,43,.06)' : 'rgba(142,68,173,.06)';
  btn.style.borderColor = PAGO_MODO === 'multi' ? 'rgba(192,57,43,.3)' : 'rgba(142,68,173,.3)';
  btn.style.color = PAGO_MODO === 'multi' ? 'var(--red)' : '#8E44AD';
  if (PAGO_MODO === 'multi') {
    clearPres();
    PAGO_MULTI_SEL = {};
    pagoMultiRenderLista();
  }
}
var EDIT_ID     = null;
var _RECIBO     = '';
// Logo oficial BarrCan (icono cuadrado) -- respaldo fijo si falla la carga

function nextFolioRB() {
  var n = parseInt(localStorage.getItem('barrcan_folio_rb') || '99') + 1;
  localStorage.setItem('barrcan_folio_rb', String(n));
  localStorage.setItem('barrcan_ultimo_folio_recibo', String(n));
  return 'RB-' + n;
}

function editarFolioRB() {
  var actual = localStorage.getItem('barrcan_folio_rb') || '99';
  var msg = 'Folio RB actual: RB-' + actual + '\n\nIngresa el numero desde donde continuar (solo el numero):';
  var nuevo = prompt(msg, actual);
  if (nuevo === null) return;
  var num = parseInt(nuevo, 10);
  if (isNaN(num) || num < 1 || String(num) !== nuevo.trim()) {
    toast('Debe ser un número entero positivo (ej: 100)');
    return;
  }
  localStorage.setItem('barrcan_folio_rb', String(num - 1));
  localStorage.setItem('barrcan_ultimo_folio_recibo', String(num - 1));
  toast('Próximo recibo será RB-' + num);
}

// ── CALCULAR SALDO REAL DESDE SUPABASE ───────────────────────────
async function recalcularSaldoReal(presupuestoId) {
  if (!sb() || !presupuestoId) return null;
  try {
    const { data: pres, error: e1 } = await sb()
      .from('presupuestos_atrasados')
      .select('monto,folio,cliente')
      .eq('id', presupuestoId)
      .single();
    if (e1 || !pres) return null;

    const { data: pagos, error: e2 } = await sb()
      .from('pagos')
      .select('monto')
      .eq('presupuesto_id', presupuestoId);

    if (e2) {
      console.warn('Error al sumar pagos:', e2.message);
      return { saldo: pres.monto || 0, total: pres.monto || 0, pagado: 0 };
    }

    const totalPagado = pagos.reduce((s, p) => s + (p.monto || 0), 0);
    const saldo = Math.max(0, (pres.monto || 0) - totalPagado);

    return { saldo, total: pres.monto || 0, pagado: totalPagado };
  } catch(e) {
    console.warn('recalcularSaldoReal error:', e.message);
    return null;
  }
}

async function recalcularPagadoAntes(presupuestoId) {
  if (!sb() || !presupuestoId) return 0;
  try {
    const { data: pagos, error } = await sb()
      .from('pagos')
      .select('monto')
      .eq('presupuesto_id', presupuestoId);
    if (error) return 0;
    return pagos.reduce((s, p) => s + (p.monto || 0), 0);
  } catch(e) {
    return 0;
  }
}

// ── Dropdown presupuestos ─────────────────────────────────────────
function cargarPresDropdown() {
  var sel = document.getElementById('pago-pres');
  if (!sel) return;

  var local = JSON.parse(localStorage.getItem('barrcan_presupuestos_cache') || '[]')
    .filter(function(p) { return ESTADOS_CON_SALDO.indexOf(p.estado) >= 0; });
  PRES_LIST = local;
  llenarDrop(local);

  if (!sb()) return;
  sb().from('presupuestos_atrasados')
    .select('id,folio,cliente,tel,dir,monto,saldo,descripcion,estado,nota_pago_pendiente')
    .in('estado', ESTADOS_CON_SALDO)
    .order('folio', { ascending: true }).limit(200)
    .then(async function(result) {
      if (result.error || !result.data || !result.data.length) return;

      var dataConSaldoReal = [];
      for (var i = 0; i < result.data.length; i++) {
        var p = result.data[i];
        var real = await recalcularSaldoReal(p.id);
        if (real) {
          p.saldo = real.saldo;
          p.monto = real.total;
        }
        dataConSaldoReal.push(p);
      }

      PRES_LIST = dataConSaldoReal;
      llenarDrop(dataConSaldoReal);

      var cache = JSON.parse(localStorage.getItem('barrcan_presupuestos_cache') || '[]');
      var pendientes = cache.filter(function(p) { return p._pendiente; });
      var merged = pendientes.concat(dataConSaldoReal);
      localStorage.setItem('barrcan_presupuestos_cache', JSON.stringify(merged));
    }).catch(function(e) {
      console.warn('cargarPresDropdown error:', e.message);
    });
}

function llenarDrop(lista) {
  var sel = document.getElementById('pago-pres');
  if (!sel) return;
  sel.innerHTML = '<option value="">&mdash; Selecciona presupuesto &mdash;</option>';
  lista.forEach(function(p) {
    var o = document.createElement('option');
    o.value = p.id;
    var est = ESTADO_SHORT[p.estado] ? ' [' + ESTADO_SHORT[p.estado] + ']' : '';
    var admin = p.nota_pago_pendiente ? ' ⚠️ Pago admin. pendiente' : '';
    o.textContent = (p.folio || '') + est + ' · ' + p.cliente + ' · Saldo $' + fmt(p.saldo || 0) + admin;
    o.dataset.p = JSON.stringify(p);
    sel.appendChild(o);
  });
}

// ── Seleccionar presupuesto ──────────────────────────────────────
async function seleccionarPres() {
  var sel = document.getElementById('pago-pres');
  if (!sel || !sel.value) { clearPres(); return; }
  try {
    var p = JSON.parse(sel.options[sel.selectedIndex].dataset.p || '{}');
    PRES_SEL = p;

    if (p.id && sb()) {
      const real = await recalcularSaldoReal(p.id);
      const pagadoReal = await recalcularPagadoAntes(p.id);

      if (real) {
        p.saldo = real.saldo;
        p.monto = real.total;
        const opt = sel.options[sel.selectedIndex];
        const est = ESTADO_SHORT[p.estado] ? ' [' + ESTADO_SHORT[p.estado] + ']' : '';
        opt.textContent = (p.folio || '') + est + ' · ' + p.cliente + ' · Saldo $' + fmt(p.saldo || 0);
        opt.dataset.p = JSON.stringify(p);
      }

      if (pagadoReal > 0) {
        document.getElementById('pago-ant').value = pagadoReal;
      }
    }

    var s = function(id, v) { var el = document.getElementById(id); if (el) el.value = v || ''; };
    s('pago-folio',   p.folio);
    s('pago-cliente', p.cliente);
    s('pago-tel',     p.tel);
    s('pago-desc',    p.descripcion);
    s('pago-total',   p.monto || 0);
    if (FORMA_SEL === 'mercado_libre') pagoBuscarDisponibilidadML();

    if (!document.getElementById('pago-ant').value) {
      var pagadoAntes = Math.max(0, (p.monto || 0) - (p.saldo || 0));
      document.getElementById('pago-ant').value = pagadoAntes || 0;
    }

    var montoSugerido = p.saldo || 0;
    if (p.saldo > 0 && p.monto > 0 && (p.saldo / p.monto) > 0.3) {
      montoSugerido = Math.round(p.saldo * 0.5);
    }
    s('pago-monto', montoSugerido);

    actualizarSaldo();

    var pct = p.monto > 0 ? (parseFloat(document.getElementById('pago-ant').value) || 0) / p.monto : 0;
    var sc = document.getElementById('pago-concepto');
    if (sc) sc.value = pct < 0.1 ? 'anticipo' : pct < 0.55 ? 'segundo_pago' : pct < 0.90 ? 'liquidacion' : 'pago_total';

    var card = document.getElementById('pago-pres-card');
    card.classList.add('visible');
    document.getElementById('pago-pres-info').textContent = p.folio + ' \u00b7 ' + p.cliente + ' \u00b7 Saldo real $' + fmt(p.saldo || 0);
  } catch(e) {
    console.warn('seleccionarPres error:', e.message);
  }
}

function clearPres() {
  PRES_SEL = null;
  document.getElementById('pago-pres').value = '';
  document.getElementById('pago-pres-card').classList.remove('visible');
}

function pagoMultiRenderLista() {
  var q = (document.getElementById('pago-multi-buscar').value || '').toLowerCase().trim();
  var lista = (PRES_LIST || []).filter(function(p) {
    return !q || (p.cliente || '').toLowerCase().indexOf(q) >= 0 || (p.folio || '').toLowerCase().indexOf(q) >= 0;
  });
  var cont = document.getElementById('pago-multi-lista');
  if (!lista.length) {
    cont.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:12px">' + (q ? 'Sin proyectos con saldo para ese cliente' : 'Escribe el nombre del cliente arriba') + '</div>';
    return;
  }
  cont.innerHTML = lista.map(function(p) {
    var sel = PAGO_MULTI_SEL[p.id];
    return '<label style="display:flex;align-items:center;gap:8px;padding:9px;border:1.5px solid ' + (sel ? 'var(--blue)' : 'var(--gray-200)') + ';border-radius:8px;margin-bottom:6px;cursor:pointer;background:' + (sel ? 'rgba(46,109,164,.05)' : 'white') + '">'
      + '<input type="checkbox" ' + (sel ? 'checked' : '') + ' onchange="pagoMultiToggle(\'' + p.id + '\',this.checked)" style="width:18px;height:18px;flex-shrink:0">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:12px;font-weight:700;color:var(--navy);font-family:monospace">' + esc(p.folio || '') + '</div>'
      + '<div style="font-size:11px;color:var(--gray-400)">' + esc(p.cliente || '') + ' \u00b7 Saldo $' + fmt(p.saldo || 0) + '</div>'
      + '</div>'
      + '</label>';
  }).join('');
}

function pagoMultiToggle(id, checked) {
  if (checked) {
    var p = (PRES_LIST || []).filter(function(x) { return x.id === id; })[0];
    if (!p) return;
    PAGO_MULTI_SEL[id] = { p: p, aplicado: 0 };
    // Precarga cliente/teléfono con el primero que se selecciona
    if (Object.keys(PAGO_MULTI_SEL).length === 1) {
      document.getElementById('pago-multi-cliente').value = p.cliente || '';
      document.getElementById('pago-multi-tel').value = p.tel || '';
    }
  } else {
    delete PAGO_MULTI_SEL[id];
  }
  pagoMultiRenderLista();
  pagoMultiActualizar();
}

// Reparte el monto total entre los proyectos seleccionados, liquidando
// cada uno en el orden en que aparecen (folio) antes de pasar al
// siguiente -- así el dinero se aplica primero a los saldos más viejos.
function pagoMultiAutoDistribuir() {
  var total = parseFloat(document.getElementById('pago-multi-total').value) || 0;
  var ids = Object.keys(PAGO_MULTI_SEL).sort(function(a, b) {
    return (PAGO_MULTI_SEL[a].p.folio || '').localeCompare(PAGO_MULTI_SEL[b].p.folio || '');
  });
  if (!ids.length) { toast('⚠️ Selecciona al menos 2 proyectos'); return; }
  var restante = total;
  ids.forEach(function(id) {
    var saldo = PAGO_MULTI_SEL[id].p.saldo || 0;
    var aplicar = Math.min(saldo, Math.max(0, restante));
    PAGO_MULTI_SEL[id].aplicado = aplicar;
    restante -= aplicar;
  });
  pagoMultiActualizar();
}

function pagoMultiActualizar() {
  var ids = Object.keys(PAGO_MULTI_SEL);
  var total = parseFloat(document.getElementById('pago-multi-total').value) || 0;
  var sumaAplicada = ids.reduce(function(a, id) { return a + (PAGO_MULTI_SEL[id].aplicado || 0); }, 0);
  var desglose = document.getElementById('pago-multi-desglose');
  desglose.innerHTML = ids.map(function(id) {
    var s = PAGO_MULTI_SEL[id];
    var restante = Math.max(0, (s.p.saldo || 0) - (s.aplicado || 0));
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:#F8F9FA;border-radius:8px;margin-bottom:6px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--navy)">' + esc(s.p.folio || '') + '</div>'
      + '<div style="font-size:10px;color:var(--gray-400)">Saldo actual $' + fmt(s.p.saldo || 0) + '</div>'
      + '</div>'
      + '<div style="width:100px">'
      + '<input type="number" min="0" max="' + (s.p.saldo || 0) + '" value="' + (s.aplicado || 0) + '" oninput="pagoMultiEditarAplicado(\'' + id + '\',this.value)" style="width:100%;padding:6px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;text-align:right">'
      + '</div>'
      + '<div style="width:70px;text-align:right;font-size:10px;color:' + (restante <= 0 ? 'var(--green)' : '#E67E22') + ';font-weight:700">' + (restante <= 0 ? 'LIQUIDA' : '$' + fmt(restante)) + '</div>'
      + '</div>';
  }).join('');

  var resumen = document.getElementById('pago-multi-resumen');
  var diff = total - sumaAplicada;
  resumen.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>Monto total recibido</span><strong>$' + fmt(total) + '</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>Repartido entre proyectos</span><strong>$' + fmt(sumaAplicada) + '</strong></div>'
    + '<div style="display:flex;justify-content:space-between;padding-top:4px;border-top:1px solid var(--gray-200)"><span>' + (Math.abs(diff) < 1 ? 'Cuadra' : diff > 0 ? 'Sin repartir' : 'Repartido de más') + '</span><strong style="color:' + (Math.abs(diff) < 1 ? 'var(--green)' : 'var(--red)') + '">$' + fmt(Math.abs(diff)) + '</strong></div>';
}

function pagoMultiEditarAplicado(id, val) {
  if (!PAGO_MULTI_SEL[id]) return;
  var monto = Math.max(0, parseFloat(val) || 0);
  var saldo = PAGO_MULTI_SEL[id].p.saldo || 0;
  if (monto > saldo) monto = saldo;
  PAGO_MULTI_SEL[id].aplicado = monto;
  pagoMultiActualizar();
}

function actualizarSaldo() {
  var total = parseFloat(document.getElementById('pago-total').value) || 0;
  var ant   = parseFloat(document.getElementById('pago-ant').value)   || 0;
  var monto = parseFloat(document.getElementById('pago-monto').value) || 0;
  var saldo = Math.max(0, total - ant - monto);
  var el = document.getElementById('pago-saldo');
  el.textContent = '$' + fmt(saldo);
  el.className = 'pago-saldo-display';
  if (saldo <= 0) el.classList.add('saldo-ok');
  else if (saldo < total * 0.2 && total > 0) el.classList.add('saldo-medio');
}

// El plazo de 5 días de Mercado Libre corre desde la ENTREGA real, no
// desde la venta -- se busca la fecha de entrega ya capturada en
// entregas.html (reportes_entrega / entregas_instalacion) para este
// folio, y se calcula sola. Si el cliente no confirma recepción en ML,
// el plazo se puede extender hasta 28 días naturales (aviso, no un
// cálculo exacto -- eso solo pasa si hay un reclamo).
async function pagoBuscarDisponibilidadML() {
  var el = document.getElementById('pago-ml-disponible');
  if (!el) return;
  var folio = PRES_SEL && PRES_SEL.folio;
  if (!folio) { el.textContent = '📅 Disponibilidad: selecciona un presupuesto para calcularla'; return; }
  if (!sb()) { el.textContent = '📅 Disponibilidad: sin conexión, no se pudo buscar la entrega'; return; }
  el.textContent = '📅 Buscando fecha de entrega…';
  try {
    var r1 = await sb().from('reportes_entrega').select('fecha_entrega').eq('folio', folio).eq('eliminado', false).order('fecha_entrega', { ascending: false }).limit(1);
    var r2 = await sb().from('entregas_instalacion').select('fecha').eq('folio', folio).eq('eliminado', false).order('fecha', { ascending: false }).limit(1);
    var fechaEntrega = null;
    if (r1.data && r1.data[0] && r1.data[0].fecha_entrega) fechaEntrega = r1.data[0].fecha_entrega;
    else if (r2.data && r2.data[0] && r2.data[0].fecha) fechaEntrega = r2.data[0].fecha;

    if (!fechaEntrega) {
      el.textContent = '📅 Disponibilidad: pendiente de entregar -- el conteo de 5 días no ha empezado';
      return;
    }
    var d = new Date(fechaEntrega + 'T00:00:00');
    d.setDate(d.getDate() + 5);
    var dStr = d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    el.innerHTML = '📅 Entregado el ' + new Date(fechaEntrega + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long' })
      + ' → disponible aprox. desde el <b>' + dStr + '</b>'
      + '<div style="font-size:10.5px;color:var(--gray-400);margin-top:3px">Si el cliente no confirma recepción en ML, esto se puede extender hasta 28 días naturales (solo si hay reclamo).</div>';
  } catch (e) {
    el.textContent = '📅 Disponibilidad: no se pudo calcular (' + e.message + ')';
  }
}

// Solo informativo, para Mau -- nunca se manda al recibo impreso.
function pagoActualizarNetoML() {
  var montoEl = document.getElementById('pago-monto');
  var comisionEl = document.getElementById('pago-comision-ml');
  var netoEl = document.getElementById('pago-ml-neto');
  if (!montoEl || !comisionEl || !netoEl) return;
  var monto = parseFloat(montoEl.value) || 0;
  var comisionPct = parseFloat(comisionEl.value) || 0;
  var neto = monto * (1 - comisionPct / 100);
  netoEl.textContent = 'Neto real que te llega: $' + fmt(neto) + ' (comisión: $' + fmt(monto - neto) + ')';
}

function pagoCargarFoto(input) {
  if (!input || !input.files || !input.files[0]) return;
  var reader = new FileReader();

    _PAGO_FOTO = e.target.result;

function pagoQuitarFoto() {

  var img  = document.getElementById('pago-foto-img');

  if (img)  img.src = '';
  if (prev) prev.classList.remove('visible');
}

// ── Escape HTML ──────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Historial de pagos ───────────────────────────────────────────
async function pagosCargar() {
  resetPaginacion();
  var div = document.getElementById('pagos-lista');
  var local = JSON.parse(localStorage.getItem('barrcan_pagos_cache') || '[]');
  if (local.length) { PAGOS_CACHE = local; pagosRender(); }
  else div.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:13px">Sin pagos registrados</div>';

  if (!sb()) return;
  try {
    var result = await sb().from('pagos')
      .select('id,monto,fecha_pago,forma_pago,concepto,notas,descripcion,comprobante_img,created_at,presupuesto_id')
      .order('created_at', { ascending: false }).limit(200);
    if (result.error) throw result.error;
    SYNC.online = true; detectarConexion();
    var pendientes = PAGOS_CACHE.filter(function(p) { return p._pendiente; });
    PAGOS_CACHE = pendientes.concat(result.data || []);
    localStorage.setItem('barrcan_pagos_cache', JSON.stringify(PAGOS_CACHE));
    pagosRender();
  } catch(e) {
    var esRed = /failed to fetch|network|fetch/i.test(e.message || '');
    if (esRed) { SYNC.online = false; detectarConexion(); }
    console.warn('pagosCargar:', e.message);
    if (!local.length)
      div.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:13px">'
        + (esRed ? 'Sin conexion' : 'Error al cargar') + '<br>'
        + '<button onclick="pagosCargar()" style="margin-top:6px;padding:5px 12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:11px;cursor:pointer">Reintentar</button></div>';
  }
}

function cargarMasPagos() {
  PAGOS_MOSTRADOS = Math.min(PAGOS_MOSTRADOS + 10, PAGOS_CACHE.length);
  pagosRender();
  var el = document.getElementById('pagos-lista');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function verTodosPagos() {
  PAGOS_MOSTRADOS = PAGOS_CACHE.length;
  pagosRender();
  var el = document.getElementById('pagos-lista');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  toast('Mostrando todos los ' + PAGOS_CACHE.length + ' pagos');
}

function pagosRender() {
  var pend = JSON.parse(localStorage.getItem('barrcan_pagos_pend') || '[]');
  var el   = document.getElementById('pagos-contador');

  if (el) {
    var total = PAGOS_CACHE.length;
    var txt = total + ' pago' + (total > 1 ? 's' : '');
    var mostrando = Math.min(PAGOS_MOSTRADOS, total);
    if (total > 0) {
      txt += ' · mostrando ' + mostrando + ' de ' + total;
    }
    if (pend.length) {
      txt += ' &middot; <span onclick="pagoReintentarPendientes()" style="color:var(--gold);font-weight:700;cursor:pointer;text-decoration:underline">' + pend.length + ' sin sincronizar</span>';
    }
    el.innerHTML = txt;
  }

  var div = document.getElementById('pagos-lista');
  if (!PAGOS_CACHE.length) {
    div.innerHTML = '<div style="text-align:center;padding:14px;color:var(--gray-400);font-size:13px">Sin pagos registrados</div>';
    return;
  }

  var hoy = new Date().toISOString().split('T')[0];
  var totalHoy = PAGOS_CACHE.filter(function(p) { return p.fecha_pago === hoy; })
    .reduce(function(s, p) { return s + (parseFloat(p.monto) || 0); }, 0);

  var html = totalHoy > 0
    ? '<div class="pago-hoy"><span class="pago-hoy-label">Cobrado hoy</span><span class="pago-hoy-monto">$' + fmt(totalHoy) + '</span></div>'
    : '';

  var mostrar = Math.min(PAGOS_MOSTRADOS, PAGOS_CACHE.length);

  for (var i = 0; i < mostrar; i++) {
    var p = PAGOS_CACHE[i];
    var cls = 'pago-item' + (p._pendiente ? ' pendiente' : '');
    var pendTag = p._pendiente ? '<div class="pago-pend-tag">SIN SINCRONIZAR</div>' : '';
    var idStr = (p.id || '').replace(/'/g, '');

    var rbMatch = (p.notas || '').match(/RECIBO:(RB-\d+)/);
    var rbLabel = rbMatch ? '<span class="pago-rb-label">' + rbMatch[1] + '</span>' : '';

    html += '<div class="' + cls + '">'
      + '<div class="pago-item-info">' + pendTag
      + '<div class="pago-item-titulo">' + (FORMA_E[p.forma_pago] || '') + ' ' + (CONCEPTO_L[p.concepto] || p.concepto || 'Pago') + rbLabel + '</div>'
      + '<div class="pago-item-detalle">' + esc(p.fecha_pago || '') + (p.notas ? ' \u00b7 ' + esc(p.notas.slice(0, 35)) : '') + '</div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px">'
      + '<div style="font-family:monospace;font-size:15px;font-weight:800;color:var(--green)">$' + fmt(p.monto) + '</div>'
      + (p.id && !p._pendiente ? '<button onclick="pagoAbrirEdicion(\'' + idStr + '\')" class="pago-item-edit">&#9999;</button>' : '')
      + '</div></div>';
  }

  // Botón "Cargar más" si hay más de 10
  if (PAGOS_MOSTRADOS < PAGOS_CACHE.length) {
    var restantes = PAGOS_CACHE.length - PAGOS_MOSTRADOS;
    html += '<div style="text-align:center;padding:8px 0;margin-top:6px">'
      + '<button onclick="cargarMasPagos()" class="btn-cargar-mas">'
      + 'Cargar ' + Math.min(10, restantes) + ' más  · ' + restantes + ' restantes'
      + '</button>'
      + '</div>';
  }

  // Botón "Ver todos" si hay más de 50
  if (PAGOS_CACHE.length > 50 && PAGOS_MOSTRADOS < PAGOS_CACHE.length) {
    html += '<div style="text-align:center;padding:4px 0">'
      + '<button onclick="verTodosPagos()" class="btn-ver-todos">'
      + 'Ver todos (' + PAGOS_CACHE.length + ')'
      + '</button>'
      + '</div>';
  }

  div.innerHTML = html;
}

// ── Guardar pago ──────────────────────────────────────────────────
function pagoGuardarDispatch() {
  if (PAGO_MODO === 'multi') pagoGuardarMultiple();
  else pagoGuardar();
}

async function pagoGuardarMultiple() {
  var ids = Object.keys(PAGO_MULTI_SEL).filter(function(id) { return (PAGO_MULTI_SEL[id].aplicado || 0) > 0; });
  var errEl = document.getElementById('pago-error');
  errEl.classList.remove('visible'); errEl.textContent = '';

  if (ids.length < 2) { errEl.textContent = 'Selecciona al menos 2 proyectos con monto aplicado'; errEl.classList.add('visible'); return; }
  var total = parseFloat(document.getElementById('pago-multi-total').value) || 0;
  var sumaAplicada = ids.reduce(function(a, id) { return a + PAGO_MULTI_SEL[id].aplicado; }, 0);
  if (Math.abs(total - sumaAplicada) > 1) { errEl.textContent = 'Lo repartido ($' + fmt(sumaAplicada) + ') no cuadra con el monto total ($' + fmt(total) + ')'; errEl.classList.add('visible'); return; }
  var fecha = document.getElementById('pago-fecha').value;
  if (!fecha) { errEl.textContent = 'Ingresa la fecha'; errEl.classList.add('visible'); return; }

  var cliente = document.getElementById('pago-multi-cliente').value.trim();
  var tel     = document.getElementById('pago-multi-tel').value.trim();
  var notas   = document.getElementById('pago-notas').value.trim();
  var factura = document.getElementById('pago-factura') ? document.getElementById('pago-factura').value.trim() : '';
  var concepto = document.getElementById('pago-concepto').value;

  var btn = document.getElementById('pago-btn');
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Generando recibo...'; }

  var folioRB = nextFolioRB();
  var lineas = [];

  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var sel = PAGO_MULTI_SEL[id];
    var saldoNuevo = Math.max(0, (sel.p.saldo || 0) - sel.aplicado);
    var notaPartes = [sel.p.folio, cliente, notas];
    if (factura) notaPartes.push('FAC:' + factura);
    var nota = notaPartes.filter(Boolean).join(' | ');
    var notaConFolio = nota + (nota ? ' | ' : '') + 'RECIBO:' + folioRB + ' | PAGO MULTIPLE (' + ids.length + ' proyectos)';
    var db = {
      monto: sel.aplicado, fecha_pago: fecha, forma_pago: FORMA_SEL, concepto: concepto,
      notas: notaConFolio.slice(0, 500) || null, descripcion: sel.p.descripcion || null, registrado_por: 'campo',
      comprobante_img: (i === 0 ? (_PAGO_FOTO || null) : null), // la foto del comprobante se adjunta solo una vez, en la primera línea
      presupuesto_id: sel.p.id
    };
    lineas.push({ db: db, folio: sel.p.folio, saldoNuevo: saldoNuevo, presId: sel.p.id, presEstado: sel.p.estado });
  }

  var fLabels = { transferencia: 'Transferencia bancaria', efectivo: 'Efectivo', tarjeta: 'Tarjeta cr\u00e9dito/d\u00e9bito' };
  _RECIBO = generarReciboMultiple({
    folioRB: folioRB, cliente: cliente, tel: tel, monto: total,
    fecha: fecha, concepto: concepto, forma: FORMA_SEL, formaLabel: fLabels[FORMA_SEL] || FORMA_SEL,
    notas: notas, factura: factura, foto: _PAGO_FOTO,
    lineas: ids.map(function(id) { return { folio: PAGO_MULTI_SEL[id].p.folio, aplicado: PAGO_MULTI_SEL[id].aplicado, saldoNuevo: Math.max(0, (PAGO_MULTI_SEL[id].p.saldo || 0) - PAGO_MULTI_SEL[id].aplicado) }; })
  });
  try { sessionStorage.setItem('barrcan_recibo_actual', _RECIBO); } catch(e) {}

  try {
    if (!SYNC.online || !sb()) {
      lineas.forEach(function(l) { guardarOffline(l.db); });
      mostrarPost(folioRB, total, tel);
      pagoResetMulti();
      if (btn) { btn.disabled = false; btn.textContent = 'Registrar Pago y Generar Recibo'; }
      return;
    }

    var result = await sb().from('pagos').insert(lineas.map(function(l) { return l.db; }));
    if (result.error) throw result.error;

    // Si alguno de los proyectos queda en $0 y todavía no estaba marcado
    // "entregado", se pregunta UNA sola vez (no por cada folio) si esos ya
    // se entregaron/instalaron -- mismo caso que en el pago individual:
    // puede ser un pago atrasado por trámite administrativo de un cliente
    // cuyo trabajo ya se había entregado.
    var hayLiquidadosPorPreguntar = lineas.some(function(l) { return l.saldoNuevo <= 0 && l.presEstado !== 'entregado'; });
    var marcarEntregados = hayLiquidadosPorPreguntar
      ? confirm('Uno o más proyectos quedan con saldo $0 tras este pago.\n\n¿Esos proyectos ya fueron entregados/instalados?')
      : false;

    for (var j = 0; j < lineas.length; j++) {
      var l = lineas[j];
      var nuevoEstado = l.presEstado === 'entregado' ? 'entregado'
        : l.saldoNuevo <= 0 ? (marcarEntregados ? 'entregado' : 'pendiente_entrega')
        : (l.presEstado === 'activo' ? 'aprobado' : l.presEstado);
      var updatePayload = { saldo: l.saldoNuevo, estado: nuevoEstado };
      if (l.saldoNuevo <= 0) updatePayload.nota_pago_pendiente = null;
      await sb().from('presupuestos_atrasados').update(updatePayload).eq('id', l.presId);
    }

    toast('Pago $' + fmt(total) + ' repartido entre ' + ids.length + ' proyectos \u00b7 Recibo ' + folioRB);
    mostrarPost(folioRB, total, tel);
    pagoResetMulti();

  } catch(e) {
    console.warn('pagoGuardarMultiple error:', e.message);
    lineas.forEach(function(l) { guardarOffline(l.db); });
    mostrarPost(folioRB, total, tel);
    pagoResetMulti();
    toast('Error al guardar — se guardó localmente');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Registrar Pago y Generar Recibo'; }
  }
}

function pagoResetMulti() {
  PAGO_MULTI_SEL = {};
  document.getElementById('pago-multi-total').value = '';

async function pagoGuardar() {
  var monto    = parseFloat(document.getElementById('pago-monto').value) || 0;
  var fecha    = document.getElementById('pago-fecha').value;
  var folio    = document.getElementById('pago-folio').value.trim();
  var cliente  = document.getElementById('pago-cliente').value.trim();
  var tel      = document.getElementById('pago-tel').value.trim();
  var desc     = document.getElementById('pago-desc').value.trim();
  var notas    = document.getElementById('pago-notas').value.trim();
  var factura  = document.getElementById('pago-factura') ? document.getElementById('pago-factura').value.trim() : '';
  var total    = parseFloat(document.getElementById('pago-total').value) || 0;
  var ant      = parseFloat(document.getElementById('pago-ant').value)   || 0;
  var concepto = document.getElementById('pago-concepto').value;
  var errEl    = document.getElementById('pago-error');

  errEl.classList.remove('visible');
  errEl.textContent = '';

  if (!monto || monto <= 0) { errEl.textContent = 'Ingresa el monto'; errEl.classList.add('visible'); return; }
  if (!fecha)               { errEl.textContent = 'Ingresa la fecha';  errEl.classList.add('visible'); return; }

  if (PRES_SEL && PRES_SEL.id) {
    const real = await recalcularSaldoReal(PRES_SEL.id);
    if (real) {
      if (monto > real.saldo) {
        errEl.textContent = 'El monto ($' + fmt(monto) + ') excede el saldo real ($' + fmt(real.saldo) + ')';
        errEl.classList.add('visible');
        return;
      }
      var saldo = Math.max(0, real.saldo - monto);
    } else {
      var saldo = Math.max(0, total - ant - monto);
    }
  } else {
    var saldo = Math.max(0, total - ant - monto);
  }

  var btn = document.getElementById('pago-btn');
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Generando recibo...'; }

  var folioRB = nextFolioRB();
  var notaPartes = [folio, cliente, notas];
  if (factura) notaPartes.push('FAC:' + factura);
  var nota = notaPartes.filter(Boolean).join(' | ');
  var notaConFolio = nota + (nota ? ' | ' : '') + 'RECIBO:' + folioRB;

  var db = {
    monto:         monto,
    fecha_pago:    fecha,
    forma_pago:    FORMA_SEL,
    concepto:      concepto,
    notas:         notaConFolio.slice(0, 500) || null,
    descripcion:   desc || null,
    registrado_por:'campo',
    comprobante_img: _PAGO_FOTO || null,
    presupuesto_id: PRES_SEL && PRES_SEL.id ? PRES_SEL.id : null,
    comision_ml_pct: FORMA_SEL === 'mercado_libre' ? (parseFloat(document.getElementById('pago-comision-ml').value) || null) : null
  };

  var fLabels = { transferencia: 'Transferencia bancaria', efectivo: 'Efectivo', tarjeta: 'Tarjeta cr\u00e9dito/d\u00e9bito', mercado_libre: 'Mercado Libre' };
  // OJO: el recibo (_RECIBO) SOLO recibe monto/forma/notas del usuario --
  // nunca comision_ml_pct ni el neto. Eso es exclusivamente para el
  // registro interno en `db`, jamás se le imprime al cliente.
  _RECIBO = generarRecibo({
    folioRB: folioRB, folio: folio, cliente: cliente, tel: tel, desc: desc,
    monto: monto, total: total, ant: ant, saldo: saldo,
    fecha: fecha, concepto: concepto, forma: FORMA_SEL,
    formaLabel: fLabels[FORMA_SEL] || FORMA_SEL,
    notas: notas, factura: factura, foto: _PAGO_FOTO
  });
  try { sessionStorage.setItem('barrcan_recibo_actual', _RECIBO); } catch(e) {}

  try {
    if (!SYNC.online || !sb()) {
      guardarOffline(db);
      mostrarPost(folioRB, monto, tel);
      pagoReset();
      if (btn) { btn.disabled = false; btn.textContent = 'Registrar Pago y Generar Recibo'; }
      return;
    }

    var result = await sb().from('pagos').insert([db]);
    if (result.error) throw result.error;

    var newPago = Object.assign({}, db, { created_at: new Date().toISOString() });
    if (result.data && result.data[0]) newPago.id = result.data[0].id;
    PAGOS_CACHE.unshift(newPago);
    localStorage.setItem('barrcan_pagos_cache', JSON.stringify(PAGOS_CACHE));
    resetPaginacion();

    if (PRES_SEL && PRES_SEL.id && sb()) {
      var nuevoEstado;
      if (PRES_SEL.estado === 'entregado') {
        nuevoEstado = 'entregado';
      } else if (saldo <= 0) {
        // Este pago deja el saldo en $0 -- antes se asumía automáticamente
        // que faltaba la entrega/instalación (pendiente_entrega). Ahora se
        // pregunta, porque puede ser al revés: ya se entregó hace tiempo y
        // el pago venía atrasado por trámite administrativo (transferencia
        // o cuenta de una empresa) -- en ese caso el estado real ya es
        // "entregado", no "pendiente de entrega".
        nuevoEstado = confirm('Este pago deja el saldo en $0.\n\n¿Este trabajo ya fue entregado/instalado?')
          ? 'entregado' : 'pendiente_entrega';
      } else {
        nuevoEstado = PRES_SEL.estado === 'activo' ? 'aprobado' : PRES_SEL.estado;
      }

      var updatePayload = { saldo: saldo, estado: nuevoEstado };
      // Si con este pago el saldo queda en $0, el pago administrativo
      // pendiente (si lo había) ya se resolvió -- se limpia la nota.
      if (saldo <= 0) updatePayload.nota_pago_pendiente = null;

      await sb().from('presupuestos_atrasados')
        .update(updatePayload)
        .eq('id', PRES_SEL.id);

      PRES_SEL.saldo = saldo;
      PRES_SEL.estado = nuevoEstado;
    }

    toast('Pago $' + fmt(monto) + ' registrado \u00b7 Recibo ' + folioRB);
    pagosRender();
    mostrarPost(folioRB, monto, tel);
    pagoReset();

  } catch(e) {
    console.warn('pagoGuardar error:', e.message);
    guardarOffline(db);
    mostrarPost(folioRB, monto, tel);
    pagoReset();
    toast('Error al guardar — se guardó localmente');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Registrar Pago y Generar Recibo'; }
  }
}

function guardarOffline(db) {
  try {
    var cola = JSON.parse(localStorage.getItem('barrcan_pagos_pend') || '[]');
    cola.push({ datos: db, ts: new Date().toISOString() });
    localStorage.setItem('barrcan_pagos_pend', JSON.stringify(cola));
    PAGOS_CACHE.unshift(Object.assign({}, db, { _pendiente: true, created_at: new Date().toISOString() }));
    localStorage.setItem('barrcan_pagos_cache', JSON.stringify(PAGOS_CACHE));
    resetPaginacion();
    pagosRender();
    toast('Pago guardado localmente');
  } catch(e) {
    // Última línea de defensa: si NI SIQUIERA se pudo guardar en el
    // localStorage del teléfono (memoria llena, modo incógnito, etc.),
    // el pago se pierde de verdad sin que nadie se entere. Antes esto
    // se tragaba en silencio total.
    console.warn('[BarrCan] No se pudo guardar el pago ni localmente:', e);
    alert('🚨 URGENTE — este pago de $' + fmt(db.monto || 0) + ' (' + (db.folio_referencia || '') + ') NO se pudo guardar NI en el servidor NI localmente en tu teléfono.\n\nSe puede perder de verdad. Por favor toma foto de esta pantalla con los datos del pago y avísale a Mau para capturarlo a mano.\n\nMotivo técnico: ' + (e && e.message ? e.message : 'desconocido'));
  }
}

async function pagoReintentarPendientes() {
  var cola = JSON.parse(localStorage.getItem('barrcan_pagos_pend') || '[]');
  if (!cola.length || !sb()) { toast('Sin pendientes'); return; }
  var ok = [];
  for (var i = 0; i < cola.length; i++) {
    try {
      var r = await sb().from('pagos').insert([cola[i].datos]);
      if (r.error) throw r.error;
      ok.push(cola[i]);
    } catch(e) { console.warn('reintento pago:', e.message); }
  }
  var rest = cola.filter(function(item) {
    for (var j = 0; j < ok.length; j++) { if (ok[j] === item) return false; }
    return true;
  });
  localStorage.setItem('barrcan_pagos_pend', JSON.stringify(rest));
  if (ok.length) {
    PAGOS_CACHE.forEach(function(p) { if (p._pendiente) delete p._pendiente; });
    localStorage.setItem('barrcan_pagos_cache', JSON.stringify(PAGOS_CACHE));
    resetPaginacion();
    toast(ok.length + ' pago(s) sincronizado(s)');
    pagosRender();
  }
  if (rest.length) toast(rest.length + ' aun pendiente(s)');

  var colaEdit = JSON.parse(localStorage.getItem('barrcan_pagos_edit_pend') || '[]');
  if (colaEdit.length && sb()) {
    var okEdit = [];
    for (var j = 0; j < colaEdit.length; j++) {
      try {
        var re2 = await sb().from('pagos').update(colaEdit[j].datos).eq('id', colaEdit[j].id);
        if (re2.error) throw re2.error;
        okEdit.push(colaEdit[j]);
      } catch(e2) { console.warn('reintento edicion:', e2.message); }
    }
    var restEdit = colaEdit.filter(function(x) { return okEdit.indexOf(x) < 0; });
    localStorage.setItem('barrcan_pagos_edit_pend', JSON.stringify(restEdit));
    if (okEdit.length) toast(okEdit.length + ' edicion(es) sincronizada(s)');
  }
}

    + '&#191;Requiere factura? Solic&#237;tela por correo a ventas&#64;barrcan.com.mx<br><br>'
    + 'Pago recibido conforme \u00b7 ' + fd(d.fecha) + '<br>'
    + '<strong>BarrCan \u00b7 TEL: 56-15-15-84-15</strong></div>'
    + '<div style="font-size:6.5pt;color:#aaa;text-align:center;margin-top:8px;border-top:1px solid #eee;padding-top:6px">'
    + d.folioRB + ' \u00b7 BarrCan \u00b7 ' + (d.fecha || '') + '</div>'
    + '</div></body></html>';
}

// ── Post pago ──────────────────────────────────────────────────────
function mostrarPost(folioRB, monto, tel) {
  var ov = document.getElementById('pago-post-ov');
  ov.dataset.tel = tel || '';
  document.getElementById('ppo-titulo').textContent = '$' + fmt(monto) + ' \u00b7 Recibo ' + folioRB;

}

function pagoPostCerrar() {
  document.getElementById('pago-post-ov').classList.remove('visible');
}

function verRecibo() {
  var html = _RECIBO;
  if (!html) {
    try { html = sessionStorage.getItem('barrcan_recibo_actual') || ''; } catch(e) {}
  }
  if (!html) { toast('El recibo no esta disponible en esta sesion'); return; }
  var win = window.open('', '_blank');
  if (win) { win.document.write(html); win.document.close(); }
  else {
    try {
      var blob = new Blob([html], { type: 'text/html' });
      var url  = URL.createObjectURL(blob);
      window.open(url, '_blank');
    } catch(e) { toast('Permite ventanas emergentes para ver el recibo'); }
  }
}

function enviarWA() {
  var ov  = document.getElementById('pago-post-ov');
  var tel = (ov.dataset.tel || '').replace(/\D/g, '');
